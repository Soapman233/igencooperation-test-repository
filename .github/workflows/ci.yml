name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  atlas:
    name: silent-failure-atlas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/silent-failure-atlas

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 门禁本身必须能被反证触发。注入 5 类已知缺陷 + 1 个未突变模板，
      # 断言校验器全部拒绝。这一条挂了说明门禁坏了，不是提交有问题。
      - name: validator selftest
        run: python tools/validate.py --selftest

      - name: validate cases
        run: python tools/validate.py

      - name: ontology selftest
        run: python tools/validate_ontology.py --selftest

      - name: validate ontology
        run: python tools/validate_ontology.py

      # 隐私扫描是阻断项，不是提醒项。一条含路径或凭据的案例会让整份语料
      # 失去可发布性，所以它跟格式校验同级。
      - name: privacy scan
        run: python tools/privacy.py

      # 提交入口也要能被反证：填好的样例必须过，未替换的模板必须被拒。
      # 一个从不拒绝任何东西的入口，等于没有入口。
      - name: submit tool selftest
        run: |
          python tools/submit.py submit/example.json --dry-run
          if python tools/submit.py submit/TEMPLATE.json --dry-run; then
            echo "::error::TEMPLATE.json 通过了提交流程，说明占位文字检查失效"
            exit 1
          fi

      # 探针框架也要能被反证：在临时副本上注入缺陷，断言探针报 fail，
      # 并断言数据源缺失时报 unknown 而不是 pass。
      # 真实探针不在这里跑——CI 没有 EigenFlux 本地数据，跑出来全是 unknown，
      # 那只是噪音，不是信号。真实探针由每日体检在本地跑。
      - name: probe selftest
        run: python probes/run.py --selftest

      # 改了案例却没重生成统计，CI 必须红。
      # 统计与实际不一致，比没有统计更危险。
      - name: report must be up to date
        run: |
          python tools/report.py
          if ! git diff --quiet -- REPORT.md; then
            echo "::error file=projects/silent-failure-atlas/REPORT.md::REPORT.md 已过期。请在本地运行 python tools/report.py 并提交结果。"
            git diff -- REPORT.md
            exit 1
          fi
